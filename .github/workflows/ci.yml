name: AgriPulse CI/CD Pipeline

on:
  push:
    branches: [ main, master, "release/**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Test & Quality Assurance
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: agripulse_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov httpx

      - name: Run Backend Pytest Suite
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:password@localhost:5432/agripulse_db
          SECRET_KEY: test_secret_key_ci_environment_32_bytes_long_value
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 60
        run: |
          cd backend
          pytest tests/ -v --tb=short

  frontend-test-build:
    name: Frontend Test & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Angular Unit Tests
        run: |
          cd frontend
          npm test -- --watch=false

      - name: Build Production Application
        run: |
          cd frontend
          npm run build

  container-verification:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test-build]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Backend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          tags: agripulse-backend:ci

      - name: Verify Frontend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: agripulse-frontend:ci
